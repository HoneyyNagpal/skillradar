name: weekly-refresh
on:
  schedule:
    - cron: "0 3 * * 1"      # Mondays 03:00 UTC, 08:30 IST
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: Ingest, build, report
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}       # hosted PostgreSQL (Neon, Supabase, ...)
          JSEARCH_API_KEY: ${{ secrets.JSEARCH_API_KEY }}
          PYTHONPATH: src
        run: python -m skillradar run --source jsearch --pages 2 --date-posted week
      - name: Publish refreshed dashboard
        run: |
          git config user.name "skillradar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/index.html reports/findings.md
          git diff --cached --quiet || (git commit -m "Weekly refresh $(date -u +%F)" && git push)